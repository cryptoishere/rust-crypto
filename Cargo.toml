[package]
name = "arkecosystem-crypto"
version = "0.2.0"
authors = ["Joshua Noack <joshua@ark.io>"]
description = "A simple Cryptography Implementation in Rust for the STH Blockchain."
license = "MIT"
edition = "2024"

[lib]
name = "arkecosystem_crypto"
path = "src/lib.rs"

[dependencies]
bs58 = { version = "0.5.1", features = ["check"] }
secp256k1 = { version = "0.33.1", default-features = false, features = ["rand", "alloc"] }
sha2 = "0.11.0"
anyhow = "1"
serde = "1"
serde_json = "1"
serde_derive = "1"
lazy_static = "1.5.0"
chrono = "0.4.44"
hex = "0.4.2"
ripemd = "0.2.0"
byteorder = "1.5.0"
log = "0.4.29"
rand = { version = "0.9.5", default-features = false, features = ["thread_rng"] }

crypto-bigint = "0.6.1"
