[package]
name = "arkecosystem-crypto"
version = "0.2.0"
authors = ["Joshua Noack <joshua@ark.io>"]
description = "A simple Cryptography Implementation in Rust for the STH Blockchain."
license = "MIT"
edition = "2024"

[lib]
name = "arkecosystem_crypto"
path = "src/lib.rs"

[dependencies]
bs58 = { version = "0.5.1", features = ["check"] }
secp256k1 = { version = "0.30.0", default-features = false, features = ["rand", "alloc" ] }
sha2 = "0.11.0"
anyhow = "1.0.102"
serde = "1.0.228"
serde_json = "1.0.149"
serde_derive = "1.0.228"
lazy_static = "1.4.0"
chrono = "0.4.44"
hex = "0.4.2"
ripemd = "0.2.0"
byteorder = "1.3.4"
log = "0.4.29"
rand = "0.8.5"

crypto-bigint = "0.6.1"