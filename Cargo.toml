[package]
name = "arkecosystem-crypto"
version = "0.1.0"
authors = ["Joshua Noack <joshua@ark.io>"]
description = "A simple Cryptography Implementation in Rust for the ARK Blockchain."
license = "MIT"
edition = "2024"

[lib]
name = "arkecosystem_crypto"
path = "src/lib.rs"

[dependencies]
bs58 = { version = "0.5.1", features = ["check"] }
secp256k1 = { version = "0.30.0", default-features = false, features = ["rand", "alloc" ] }
sha2 = "0.10.9"
anyhow = "1.0.99"
serde = "1.0.115"
serde_json = "1.0.57"
serde_derive = "1.0.115"
lazy_static = "1.4.0"
chrono = "0.4.15"
hex = "0.4.2"
ripemd = "0.1.3"
byteorder = "1.3.4"
log = "0.4.27"
rand = "0.8"

crypto-bigint = "0.6.1"